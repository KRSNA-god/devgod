[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devgod"
version = "27.0.0"
description = "DEV BHAGWAN - Ultimate 24/7 Telegram Bot Cluster Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "god_olds" }
]
keywords = ["telegram", "bot", "devgod", "matrix", "cluster", "telegram-bot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
]
dependencies = [
    "python-telegram-bot>=20.0,<22.0",
]

[project.urls]
Homepage = "https://github.com/hostgodx/devgod"
Repository = "https://github.com/hostgodx/devgod.git"
Issues = "https://github.com/hostgodx/devgod/issues"

[project.scripts]
devgod = "devgod.cli:main"
dev-god = "devgod.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devgod = ["*.txt", "*.md"]
